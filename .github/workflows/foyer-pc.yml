name: Foyer for PC

# Builds Foyer for Windows on GitHub's own Windows machine (no Windows PC needed to build)
# and attaches Foyer-PC-<version>.zip to a "Foyer for PC" pre-release.
# Runs when VERSION changes on main, or by hand: Actions > Foyer for PC > Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make the Windows project and build it
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          pip install --quiet pillow
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name foyer --org com.leclair build_pc
          Remove-Item -Recurse -Force build_pc\lib
          Copy-Item -Recurse lib build_pc\lib
          python tools/patch_fonts.py build_pc
          python -c "from PIL import Image; Image.open('docs/icon.png').convert('RGBA').save('build_pc/windows/runner/resources/app_icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          (Get-Content build_pc\windows\runner\main.cpp) -replace 'L"foyer"', 'L"Foyer"' | Set-Content build_pc\windows\runner\main.cpp
          $v = (Get-Content VERSION).Trim()
          Push-Location build_pc
          flutter build windows --release -t lib/pc/main_pc.dart --dart-define=FOYER_VERSION=$v --dart-define=FOYER_BUILD=${{ github.run_number }}
          Pop-Location

      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force pkg\Foyer-PC\app | Out-Null
          Copy-Item -Recurse build_pc\build\windows\x64\runner\Release\* pkg\Foyer-PC\app
          Copy-Item pc\install.ps1, 'pc\Install Foyer.cmd', pc\README.txt pkg\Foyer-PC
          Compress-Archive -Path pkg\Foyer-PC -DestinationPath "Foyer-PC-$v.zip"
          "ZIP=Foyer-PC-$v.zip" >> $env:GITHUB_ENV
          "VER=$v" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Foyer-PC
          path: ${{ env.ZIP }}

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          python tools/release_notes.py $env:VER > notes.md
          $tag = "pc-v$($env:VER)+${{ github.run_number }}"
          # a pre-release, so it never counts as the TV app's latest release
          gh release create $tag $env:ZIP --title "Foyer for PC $($env:VER)" --notes-file notes.md --prerelease --target ${{ github.sha }}
