services:
  foyer-drop:
    build: .
    container_name: foyer-drop
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Set this to a long random string (for example: openssl rand -hex 24).
      # You type the same token into your phone's page and into Foyer's settings.
      FOYER_TOKEN: "change-me-to-a-long-random-string"
      # NOTE_HOURS: "24"        # how long notes show by default
      # MAX_PHOTO_PX: "1920"    # photos are shrunk to this size for the stick
    volumes:
      - ./data:/data
